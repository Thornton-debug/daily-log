name: Daily Activity Log
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly grants push permission
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches full history to avoid detached HEAD issues

      - name: Generate Log Entry
        run: |
          echo "## Log Entry: $(date -u)" >> README.md
          echo "Keeping the contribution streak alive!" >> README.md
          echo "---" >> README.md

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Daily update: $(date -u)" || echo "No changes to commit"
          # 🔥 FIXED: Explicitly push the current commit to the remote 'main' branch
          git push origin HEAD:main
