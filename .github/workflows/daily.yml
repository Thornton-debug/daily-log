name: Daily Activity Log
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Log Entry
        run: |
          echo "## Log Entry: $(date -u)" >> README.md
          echo "Keeping the contribution streak alive!" >> README.md
          echo "---" >> README.md
      
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Daily update: $(date)" || echo "No changes to commit"
          git push
